# Stack da Barbearia da Vila no servidor proprio (srv1726158). Deploy:
#   docker stack deploy -c infra/stack-bv.yml bv
# Segredos sao docker secrets externos, criados por infra/criar-segredos.sh; nenhum valor aqui.
services:
  traefik:
    image: traefik:v3.7.15
    command:
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=bv_proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --log.level=INFO
    ports:
      # modo host preserva o IP do cliente (N8N_PROXY_HOPS=1)
      - {target: 80, published: 80, mode: host}
      - {target: 443, published: 443, mode: host}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_le:/letsencrypt
    networks: [proxy]
    deploy:
      placement: {constraints: [node.role == manager]}
      resources: {limits: {memory: 256M}}

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.5
    environment:
      N8N_HOST: n8nv.todo-tips.com
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      NODE_ENV: production
      WEBHOOK_URL: https://n8nv.todo-tips.com/
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_PROXY_HOPS: "1"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/bv_pg_n8n_password
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/bv_n8n_encryption_key
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_DISABLED_MODULES: instance-ai
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      NODE_OPTIONS: --dns-result-order=ipv4first
    secrets: [bv_pg_n8n_password, bv_n8n_encryption_key]
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [proxy, bv]
    deploy:
      resources: {limits: {memory: 2G}}
      labels:
        - traefik.enable=true
        - traefik.http.routers.n8n.rule=Host(`n8nv.todo-tips.com`)
        - traefik.http.routers.n8n.entrypoints=websecure
        - traefik.http.routers.n8n.tls.certresolver=le
        - traefik.http.services.n8n.loadbalancer.server.port=5678
        - traefik.http.middlewares.n8n-sec.headers.stsSeconds=315360000
        - traefik.http.middlewares.n8n-sec.headers.stsIncludeSubdomains=true
        - traefik.http.middlewares.n8n-sec.headers.contentTypeNosniff=true
        - traefik.http.middlewares.n8n-sec.headers.browserXssFilter=true
        - traefik.http.routers.n8n.middlewares=n8n-sec

  postgres:
    image: postgres:17.10
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD_FILE: /run/secrets/bv_pg_n8n_password
    secrets: [bv_pg_n8n_password]
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [bv]
    deploy:
      resources: {limits: {memory: 1G}}

  redis:
    image: redis:7.2.16-alpine
    # senha lida do secret, nunca na linha de comando do compose
    entrypoint: ["sh", "-c", "exec redis-server --port 6379 --requirepass \"$$(cat /run/secrets/bv_redis_password)\" --appendonly yes --appendfsync everysec --save '' --maxmemory 512mb --maxmemory-policy volatile-lru"]
    secrets: [bv_redis_password]
    volumes:
      - redis_data:/data
    networks: [bv]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/bv_redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 3s
      retries: 5
    deploy:
      resources: {limits: {memory: 640M}}

networks:
  proxy:
    driver: overlay
  bv:
    driver: overlay
    internal: true

volumes:
  traefik_le:
  n8n_data:
  pg_data:
  redis_data:

secrets:
  bv_pg_n8n_password: {external: true}
  bv_n8n_encryption_key: {external: true}
  bv_redis_password: {external: true}
